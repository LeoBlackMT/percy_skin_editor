name: Code Checks (static/type/security)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 以前每一步都写着 `cd percy_skin_editor || exit 0`，而仓库根就是项目根：
      # cd 失败后整步以 0 退出，ruff / mypy / pip-audit 从未真正运行过。
      # 下面两步是确定性的阻塞关卡，任何一步失败都会让检查变红。
      - name: Compile check
        run: python -m py_compile percy.py

      - name: Import check
        run: python -c "import percy; print('percy v' + percy.VERSION + ' imported OK')"

      - name: Install analysis tools
        run: pip install ruff mypy pip-audit

      # 本仓库目前没有 ruff / mypy 基线，这三步先只展示结果、不阻断合并；
      # 等基线清理干净后再去掉 continue-on-error。
      - name: Lint (ruff)
        continue-on-error: true
        run: ruff check --output-format=concise .

      - name: Types (mypy)
        continue-on-error: true
        run: mypy percy.py

      - name: Dependency audit (pip-audit)
        continue-on-error: true
        run: pip-audit -r requirements.txt --progress-spinner=off
